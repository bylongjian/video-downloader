/* Readable layout: shared by the self-contained prototypes and the Vue app. */
body{font-size:16px;line-height:1.75}
.container{width:100%;max-width:1760px;padding-inline:32px}
.tiny,.text-button.tiny{font-size:14px}
.button{min-height:52px;padding:12px 24px;font-size:16px}
.icon-button{min-width:44px;min-height:44px}
.tag{font-size:13px;padding:4px 10px}
.header-inner{height:88px;gap:28px}
.header-nav{font-size:16px;gap:32px}
.header-actions .button{min-height:48px}
.brand-tag{font-size:14px}
.hero-content{padding-top:64px}
.hero h1{font-size:clamp(44px,4.2vw,72px)}
.hero-description{font-size:20px}
.url-form{max-width:1120px;margin-top:36px}
.url-form.compact-form{max-width:none;margin:0}
.url-field{padding:10px;gap:12px}
.url-field input{font-size:18px;min-height:48px}
.input-label{font-size:14px}
.try-links,.try-links button,.hero-assurances{font-size:14px}
.platform-strip{margin-top:44px}
.platform-strip>p{font-size:14px}
.section{padding:72px 0}
.section-heading>p,.center-heading>p:last-child{font-size:16px}
.feature-showcase{padding:32px 36px 0;min-height:640px}
.feature-showcase>p,.small-feature p{font-size:16px}
.small-feature{padding:28px;min-height:280px}
.small-feature h3{font-size:20px}
.mini-summary{max-width:520px}
.steps{max-width:1200px;gap:32px}
.pricing-grid{max-width:1100px;gap:28px}
.price-card{padding:32px}
.check-list{font-size:16px;gap:14px}
.faq-items summary{font-size:18px}
.faq-items details p{font-size:16px}
.footer-links,.footer-caption,.footer-bottom{font-size:14px}
.workspace-topline{font-size:14px;padding-top:24px}
.workspace-heading{margin:30px 0 24px}
.workspace-heading h1{font-size:32px}
.workspace-grid{grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:28px}
.workspace-grid>*,.ai-heading>div,.subtitle-actions,.map-actions{min-width:0}
.video-card-body{padding:28px}
.video-card h2{font-size:24px;line-height:1.5;overflow-wrap:anywhere}
.video-description{font-size:16px;margin-block:18px 24px}
.creator-line{font-size:14px;flex-wrap:wrap}
.format-heading h3{font-size:18px}
.format-heading .tag,.format-label{font-size:14px}
.format-option{min-height:60px;padding:14px;gap:12px}
.format-option input{width:20px;height:20px;flex-shrink:0}
.format-option>div{flex-wrap:wrap;gap:8px;min-width:0}
.format-option strong{font-size:16px}
.format-option .format-ext,.format-option>.format-size{font-size:14px}
.format-option .recommended{font-size:12px}
.download-hint,.workspace-tip,.download-status{font-size:14px}
.ai-heading{padding:28px 30px 22px;gap:14px;flex-wrap:wrap}
.ai-heading h2{font-size:22px}
.ai-heading p{font-size:14px}
.ai-brand-icon{width:48px;height:48px;flex-shrink:0}
.ai-status{font-size:13px;white-space:normal}
.ai-tabs{padding-inline:20px;gap:8px}
.ai-tabs button{font-size:16px;min-height:60px;gap:8px;padding:12px 6px}
.ai-tabs .icon{display:inline-block;width:20px;height:20px;flex-shrink:0}
.ai-content{padding:24px 30px 32px}
.panel-toolbar{gap:12px;flex-wrap:wrap;margin-bottom:20px}
.panel-toolbar>span,.panel-toolbar>.muted,.panel-toolbar .text-button{font-size:14px}

  for(const d of document.querySelectorAll('dialog')) { d.addEventListener('click',e=>{if(e.target===d){const rect=d.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)d.close();}}); }

  document.getElementById('parse-form').onsubmit=e=>{e.preventDefault();const result=validateUrl(urlInput.value);if(result.error){document.getElementById('url-error').textContent=result.error;urlInput.setAttribute('aria-invalid','true');urlInput.focus();return;}if(isHome)goWorkbench(result.url);else document.dispatchEvent(new CustomEvent('saveany:parse',{detail:result.url}));};
  window.App = {icon,icons,esc,read,save,toast,openAuth,requireLogin,openVip,remaining,getUser:()=>user,examples,normalizeUrl,validateUrl,downloadFile,copyText,spend:()=>{if(!user||user.vip)return;const key=`saveany.quota.${user.email}`;const q=read(key,{date:today(),used:0});save(key,{date:today(),used:(q.date===today()?q.used:0)+1});notifyUser();},exhaust:()=>{if(!user)return;save(`saveany.quota.${user.email}`,{date:today(),used:3});notifyUser();}};
  renderAccount();icons();
})();

</script>
<script>
/* Inlined from workbench.js */
(() => {
  'use strict';
  const A=window.App, $=id=>document.getElementById(id);
  const state={video:null,url:'',parsed:false,ready:false,generating:false,run:0,tab:'summary',scenario:'normal',messages:[],chatBusy:false,chatRun:0,expanded:false,downloadBusy:false,downloadRun:0,collapsed:new Set(),mapScale:1,mapX:0,mapY:0};
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const empty=(icon,title,text,button='')=>`<div class="empty-state"><span class="empty-illustration">${A.icon(icon)}</span><h3>${title}</h3><p>${text}</p>${button}</div>`;
  const stamp=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;
  function syncQuota(){const user=A.getUser();$('quota-label').textContent=user?(user.vip?'VIP · 不限次数':`今日剩余 ${A.remaining()} / 3 次`):'登录后每天免费 3 次';document.querySelector('.ai-footer [data-vip]').hidden=!!user?.vip;}
  function setStatus(text,ready=false){$('ai-status').textContent=text;$('ai-status').classList.toggle('ready',ready);}
  function renderGate(){
    syncQuota();
    if(!A.getUser()){setStatus('登录即可体验');$('ai-gate').innerHTML=empty('sparkles','给好内容，多一种读法。','登录后自动生成视频摘要、字幕与思维导图。免费账号每天可总结 3 个视频。','<button class="button primary" id="gate-login">登录并生成总结'+A.icon('arrow-right')+'</button><button class="text-button" id="gate-demo">先用演示账号体验</button>');$('gate-login').onclick=()=>A.requireLogin(startSummary);$('gate-demo').onclick=()=>{A.openAuth('login',startSummary);};return;}
    if(!state.ready&&A.remaining()===0&&!state.generating){setStatus('今日额度已用完');$('ai-gate').innerHTML=empty('coffee','今天已经收获很多了。','免费 AI 总结次数已用完，明天自动恢复。你仍然可以下载视频，也可以升级 VIP 继续探索。','<button class="button primary" id="gate-vip">'+A.icon('crown')+'升级 VIP，继续探索</button><button class="text-button" id="gate-reset">重置演示额度</button>');$('gate-vip').onclick=()=>A.openVip(startSummary);$('gate-reset').onclick=resetDemoQuota;return;}
    $('ai-gate').innerHTML='';
  }
  function resetDemoQuota(){const user=A.getUser();A.save(`saveany.quota.${user.email}`,{date:new Date().toLocaleDateString('sv-SE'),used:0});state.scenario='normal';$('scenario').value='normal';syncQuota();A.toast('演示额度已重置');startSummary();}
  async function parse(url,updateUrl=true){
    state.url=url;state.parsed=false;state.ready=false;state.generating=false;state.chatBusy=false;state.chatRun++;state.downloadRun++;state.downloadBusy=false;state.messages=[];state.expanded=false;const run=++state.run;
    $('video-url').value=url;$('video-url').dispatchEvent(new Event('input'));
    if(updateUrl){const next=new URL(location.href);next.searchParams.set('url',url);next.searchParams.set('scene',state.scenario);history.replaceState(null,'',next);}
    $('workspace-grid').hidden=true;$('parse-button').disabled=true;$('parse-button').innerHTML='<span class="spinner"></span>解析中…';
    $('parse-state').innerHTML=`<div class="loading-caption"><span class="spinner"></span>正在识别平台并获取视频信息…</div><div class="parse-loading"><div class="card skeleton-card"><div class="skeleton cover-skeleton"></div><div class="skeleton medium"></div><div class="skeleton short"></div><div class="skeleton"></div></div><div class="card skeleton-card"><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton medium"></div><div class="skeleton"></div><div class="skeleton short"></div></div></div>`;
    await wait(1200);if(run!==state.run)return;
    $('parse-button').disabled=false;$('parse-button').innerHTML=A.icon('sparkles')+'解析视频';
    if(state.scenario==='parse-error'){$('parse-state').innerHTML=`<div class="card">${empty('link','这段视频，暂时没找到。','链接可能已失效，或平台暂时无法访问。检查链接后重试，也可以先体验示例视频。','<button class="button primary" id="parse-retry">'+A.icon('rotate-cw')+'重新解析</button><button class="text-button" id="parse-example">使用示例视频</button>')}</div>`;$('parse-retry').onclick=()=>{state.scenario='normal';$('scenario').value='normal';parse(state.url);};$('parse-example').onclick=()=>{state.scenario='normal';$('scenario').value='normal';parse(A.examples.bilibili);};return;}
    state.video=/youtube\.com|youtu\.be/i.test(url)?DemoData.youtube:DemoData.bilibili;
    $('parse-state').innerHTML='';$('workspace-grid').hidden=false;state.parsed=true;renderVideo();resetPanels();switchTab(location.hash.slice(1)||'summary',false);

    renderGate();if(A.getUser())startSummary();
  }
  function renderVideo(){const v=state.video;$('video-title').textContent=v.title;$('video-uploader').textContent=v.uploader;$('video-views').textContent=v.views;$('video-date').textContent=v.date;$('video-platform').textContent=v.platform;$('creator-avatar').textContent=v.avatar;$('video-description').textContent=v.description;$('video-cover').setAttribute('aria-label',v.title+'的示例封面');$('video-cover').innerHTML=`<span class="cover-decoration"></span><div class="cover-top"><span class="status-dot"></span>SAVEANY ORIGINAL DEMO</div><div class="cover-title">${v.coverTitle}<small>${v.coverSubtitle}</small></div><div class="cover-chip">${A.icon('git-branch')}</div><div class="cover-bottom">${v.coverBottom}</div><span class="duration">${v.duration}</span>`;
    $('format-options').innerHTML=v.formats.map((f,i)=>`<label class="format-option"><input type="radio" name="format" value="${i}" ${i===0?'checked':''}><div><strong>${f.quality}</strong><span class="format-ext">${f.ext}</span>${f.recommended?'<span class="recommended">推荐</span>':''}</div><span class="format-size">${f.size}</span></label>`).join('');$('format-options').onchange=updateDownloadLabel;updateDownloadLabel();$('download-status').innerHTML='';}
  function updateDownloadLabel(){const selected=Number(document.querySelector('input[name=format]:checked').value);$('download-size').textContent=state.video.formats[selected].size;}
  function resetPanels(){state.collapsed=new Set();state.mapScale=1;state.mapX=0;state.mapY=0;$('summary-content').innerHTML='';$('subtitle-content').innerHTML='';$('mindmap-content').innerHTML='';$('chat-content').innerHTML='';$('copy-summary').disabled=true;$('regenerate').disabled=true;$('ai-gate').innerHTML='';$('download-button').disabled=false;setStatus('等待生成');}
  function switchTab(tab,update=true){const valid=['summary','subtitle','mindmap','qa'];if(!valid.includes(tab))tab='summary';state.tab=tab;document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;});valid.forEach(t=>{$('panel-'+t).hidden=t!==tab;});if(update){const next=new URL(location.href);next.hash=tab;history.replaceState(null,'',next);}if(!A.getUser()||(!state.ready&&!state.generating&&A.remaining()===0))renderGate();}
  document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>switchTab(b.dataset.tab);b.addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('[data-tab]')];let i=tabs.indexOf(b);if(e.key==='ArrowRight')i=(i+1)%tabs.length;else if(e.key==='ArrowLeft')i=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();tabs[i].focus();switchTab(tabs[i].dataset.tab);});});
  window.addEventListener('hashchange',()=>switchTab(location.hash.slice(1),false));
  function summaryBlocks(){const v=state.video;return [`<div class="summary-intro"><div class="overline">${A.icon('sparkles')}先读这一段</div><p>${v.intro}</p></div>`,`<section class="summary-section"><h3><span class="section-num">01</span>视频讲了什么</h3><p>${v.overview}</p></section>`,`<section class="summary-section"><h3><span class="section-num">02</span>跟着大纲，快速定位</h3><ol class="outline-list">${v.outline.map(o=>`<li><span class="time-badge">${o[0]}</span><div><strong>${o[1]}</strong><p>${o[2]}</p></div></li>`).join('')}</ol></section>`,`<section class="summary-section"><h3><span class="section-num">03</span>值得带走的 ${v.points.length} 个要点</h3><ul class="key-points">${v.points.map(p=>'<li>'+p+'</li>').join('')}</ul></section>`,`<section class="summary-section"><h3><span class="section-num">04</span>一句话记住</h3><div class="summary-quote">${v.quote}</div></section><div class="generated-note">${A.icon('info')}以上为原型示例内容，非当前链接的实时分析。</div>`];}
  async function startSummary(){
    if(!state.parsed||state.generating)return;
    if(!A.getUser()){renderGate();return;}
    if(A.remaining()===0){state.ready=false;renderGate();return;}
    const run=++state.run;state.ready=false;state.generating=true;state.chatRun++;state.chatBusy=false;state.messages=[];state.expanded=false;resetPanels();setStatus('正在提取字幕');$('regenerate').disabled=true;
    for(const id of ['summary-content','subtitle-content','mindmap-content','chat-content'])$(id).innerHTML=empty('sparkles','正在理解这段视频…','提取字幕、梳理重点，把好内容变成清晰的知识。');
    $('summary-content').innerHTML='<div class="ai-generation"><div class="loading-caption"><span class="spinner"></span>正在提取字幕，准备整理重点…</div><div class="skeleton"></div><div class="skeleton medium"></div><div class="skeleton"></div><div class="skeleton short"></div></div>';
    await wait(1000);if(run!==state.run)return;
    if(state.scenario==='no-subtitles'){
      state.generating=false;setStatus('暂无可用字幕');const text=empty('captions','这个视频，还没有字幕。','暂时无法生成摘要、思维导图或回答问题。你仍可下载视频，也可以换一个带字幕的视频继续探索。','<button class="button outline" id="try-subtitled">试试有字幕的示例'+A.icon('arrow-right')+'</button>');
      for(const id of ['summary-content','subtitle-content','mindmap-content','chat-content'])$(id).innerHTML=text.replace('id="try-subtitled"','data-try-subtitled');document.querySelectorAll('[data-try-subtitled]').forEach(b=>b.onclick=()=>{state.scenario='normal';$('scenario').value='normal';parse(A.examples.bilibili);});$('regenerate').disabled=false;syncQuota();return;
    }
    if(state.scenario==='ai-error'){
      state.generating=false;setStatus('生成暂时中断');const error=empty('alert-circle','刚才的思路，暂时中断了。','AI 服务暂时没有响应。本次不消耗总结额度，视频下载仍可正常使用。','<button class="button primary" data-retry-ai>'+A.icon('rotate-cw')+'重新生成</button>');for(const id of ['summary-content','subtitle-content','mindmap-content','chat-content'])$(id).innerHTML=error;document.querySelectorAll('[data-retry-ai]').forEach(b=>b.onclick=()=>{state.scenario='normal';$('scenario').value='normal';startSummary();});$('regenerate').disabled=false;return;
    }
    renderSubtitles();setStatus('AI 正在整理');$('summary-content').innerHTML='<div id="stream-output"></div><div class="loading-caption" id="stream-status"><span class="spinner"></span>正在生成摘要…</div>';
    const blocks=summaryBlocks();for(const block of blocks){if(run!==state.run)return;const el=document.createElement('div');el.className='stream-block';el.innerHTML=block;$('stream-output').append(el);await wait(reduced?75:380);}
    if(run!==state.run)return;$('stream-status').remove();state.generating=false;state.ready=true;A.spend();setStatus('已整理完成',true);$('copy-summary').disabled=false;$('regenerate').disabled=false;renderMindmap();renderChat();syncQuota();
  }
  $('regenerate').onclick=()=>{if(A.remaining()===0){A.openVip(startSummary);return;}state.scenario='normal';$('scenario').value='normal';startSummary();};
  $('copy-summary').onclick=()=>A.copyText(`${state.video.title}\n\n${$('summary-content').innerText}`);
  function renderSubtitles(){const v=state.video;const visible=state.expanded?v.subtitles:v.subtitles.slice(0,6);$('subtitle-content').innerHTML=`<div class="subtitle-toolbar"><div><p>共 ${v.subtitles.length} 条字幕</p><span class="tag">${v.platform==='YouTube'?'示例旁白 · 中文':'示例字幕 · 简体中文'}</span></div><div class="subtitle-actions"><label class="sr-only" for="subtitle-format">字幕导出格式</label><select id="subtitle-format"><option value="srt">SRT 字幕</option><option value="vtt">VTT 字幕</option><option value="txt">TXT 文本</option></select><button class="button outline" id="export-subtitles">${A.icon('download')}下载字幕</button></div></div><div class="subtitle-list">${visible.map(s=>`<div class="subtitle-row"><span class="time-badge">${stamp(s[0])}</span><span>${s[2]}</span></div>`).join('')}</div>${v.subtitles.length>6?`<button class="subtitle-more" id="expand-subtitles">${state.expanded?'收起字幕':'展开全部 '+v.subtitles.length+' 条字幕'} ${A.icon(state.expanded?'chevron-up':'chevron-down')}</button>`:''}<div class="generated-note">${A.icon('info')}字幕为场景示例，可导出实际文件。</div>`;$('export-subtitles').onclick=exportSubtitles;if($('expand-subtitles'))$('expand-subtitles').onclick=()=>{state.expanded=!state.expanded;renderSubtitles();};}
  function exportSubtitles(){const ext=$('subtitle-format').value;const segments=state.video.subtitles;const time=(n,sep)=>`00:${stamp(n)}${sep}000`;const content=ext==='txt'?segments.map(s=>s[2]).join('\n'):(ext==='vtt'?'WEBVTT\n\n':'')+segments.map((s,i)=>`${ext==='srt'?i+1+'\n':''}${time(s[0],ext==='srt'?',':'.')} --> ${time(s[1],ext==='srt'?',':'.')}\n${s[2]}\n`).join('\n');A.downloadFile(content,`SaveAny-${state.video.platform}-示例字幕.${ext}`);A.toast(`已导出 ${ext.toUpperCase()} 示例字幕`);}
  function mapSvg(exporting=false){
    const m=state.video.mindmap;const branchYs=[70,175,280,385];let content=`<path d="M147 228H184" stroke="#b3c5dc" stroke-width="1.5" fill="none"/><rect x="25" y="204" width="122" height="48" rx="12" fill="#1777ff"/><text x="86" y="234" text-anchor="middle" fill="white" font-size="18" font-weight="600">${m.root}</text>`;
    m.branches.forEach((b,i)=>{const y=branchYs[i];const collapsed=state.collapsed.has(i);content+=`<path d="M147 228C180 228 170 ${y+19} 210 ${y+19}" stroke="${b.color}" stroke-width="1.5" fill="none"/><g class="map-node" ${exporting?'':`data-branch="${i}" role="button" tabindex="0" aria-label="${collapsed?'展开':'折叠'}${b.title}" aria-expanded="${!collapsed}"`}><rect x="210" y="${y}" width="128" height="38" rx="8" fill="white" stroke="${b.color}" stroke-width="1.2"/><text x="269" y="${y+24}" text-anchor="middle" fill="#3a4d65" font-size="16">${b.title}</text><circle cx="338" cy="${y+19}" r="7" fill="white" stroke="${b.color}"/><text x="338" y="${y+23}" text-anchor="middle" fill="${b.color}" font-size="12">${collapsed?'+':'−'}</text></g>`;if(!collapsed)b.children.forEach((child,j)=>{const cy=y+(j-(b.children.length-1)/2)*29+19;content+=`<path d="M345 ${y+19}C362 ${y+19} 353 ${cy} 375 ${cy}" stroke="${b.color}" stroke-width="1" opacity=".65" fill="none"/><text x="383" y="${cy+4}" fill="#5f7187" font-size="14">${child}</text>`;});});
    return `<svg xmlns="http://www.w3.org/2000/svg" ${exporting?'':'id="map-canvas" class="map-canvas"'} viewBox="0 0 560 470" ${exporting?'width="4480" height="3760"':''} style="font-family:Arial,Microsoft YaHei,sans-serif" role="${exporting?'img':'group'}" aria-label="${m.root}思维导图"><rect width="560" height="470" fill="${exporting?'#ffffff':'transparent'}"/><g id="map-transform" transform="translate(${exporting?0:state.mapX},${exporting?0:state.mapY}) translate(280 235) scale(${exporting?1:state.mapScale}) translate(-280 -235)">${content}</g></svg>`;
  }
  function renderMindmap(){
    $('mindmap-content').innerHTML=`<div class="map-toolbar"><span class="muted">把内容，连成一张图。</span><div class="map-actions"><button class="button outline" id="export-png">${A.icon('download')}PNG</button><button class="button outline" id="export-svg">SVG</button><button class="icon-button" id="map-fullscreen" aria-label="全屏思维导图" title="全屏">${A.icon('expand')}</button></div></div><div class="map-wrap" id="map-wrap"><button class="button outline small map-exit" id="map-exit">${A.icon('x')}退出全屏</button><div id="map-drawing">${mapSvg()}</div><div class="map-nav"><button class="icon-button" id="map-zoom-out" aria-label="缩小导图">${A.icon('minus')}</button><span class="tiny muted" id="map-percent">${Math.round(state.mapScale*100)}%</span><button class="icon-button" id="map-zoom-in" aria-label="放大导图">${A.icon('plus')}</button><button class="icon-button" id="map-left" aria-label="导图向左平移">${A.icon('chevron-left')}</button><button class="icon-button" id="map-right" aria-label="导图向右平移">${A.icon('chevron-right')}</button><button class="icon-button" id="map-up" aria-label="导图向上平移">${A.icon('chevron-up')}</button><button class="icon-button" id="map-down" aria-label="导图向下平移">${A.icon('chevron-down')}</button><button class="icon-button" id="map-reset" aria-label="导图适应画布" title="适应画布">${A.icon('rotate-cw')}</button></div></div><p class="map-help">点击节点展开 / 折叠 · 拖动空白处平移 · 使用按钮缩放与定位</p>`;
    const draw=()=>{$('map-drawing').innerHTML=mapSvg();bindMap();$('map-percent').textContent=Math.round(state.mapScale*100)+'%';};
    $('map-zoom-in').onclick=()=>{state.mapScale=Math.min(2,state.mapScale+.15);draw();};$('map-zoom-out').onclick=()=>{state.mapScale=Math.max(.55,state.mapScale-.15);draw();};$('map-reset').onclick=()=>{state.mapScale=1;state.mapX=0;state.mapY=0;draw();};for(const [name,x,y]of[['left',-35,0],['right',35,0],['up',0,-35],['down',0,35]])$('map-'+name).onclick=()=>{state.mapX+=x;state.mapY+=y;draw();};
    $('map-fullscreen').onclick=async()=>{try{await $('map-wrap').requestFullscreen();}catch{A.toast('当前浏览器不支持全屏，可使用缩放按钮查看');}};$('map-exit').onclick=()=>document.exitFullscreen();
    $('export-svg').onclick=()=>{A.downloadFile(mapSvg(true),'SaveAny-示例思维导图.svg','image/svg+xml;charset=utf-8');A.toast('已导出完整 SVG 思维导图');};$('export-png').onclick=exportPng;bindMap();
  }
  function bindMap(){
    const canvas=$('map-canvas');canvas.querySelectorAll('[data-branch]').forEach(node=>{const toggle=()=>{const key=Number(node.dataset.branch);state.collapsed.has(key)?state.collapsed.delete(key):state.collapsed.add(key);$('map-drawing').innerHTML=mapSvg();bindMap();};node.onclick=toggle;node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};});
    let origin=null;
    canvas.onpointerdown=e=>{if(e.target.closest('[data-branch]'))return;origin={x:e.clientX,y:e.clientY,mx:state.mapX,my:state.mapY};canvas.setPointerCapture(e.pointerId);};
    canvas.onpointermove=e=>{if(!origin)return;const rect=canvas.getBoundingClientRect();state.mapX=origin.mx+(e.clientX-origin.x)*560/rect.width;state.mapY=origin.my+(e.clientY-origin.y)*470/rect.height;$('map-transform').setAttribute('transform',`translate(${state.mapX},${state.mapY}) translate(280 235) scale(${state.mapScale}) translate(-280 -235)`);};canvas.onpointerup=()=>{origin=null;};canvas.onpointercancel=()=>{origin=null;};
  }
  async function exportPng(){const button=$('export-png');button.disabled=true;const img=new Image();const url=URL.createObjectURL(new Blob([mapSvg(true)],{type:'image/svg+xml;charset=utf-8'}));img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=4480;canvas.height=3760;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,4480,3760);URL.revokeObjectURL(url);canvas.toBlob(blob=>{button.disabled=false;if(blob){A.downloadFile(blob,'SaveAny-4K-示例思维导图.png');A.toast('已导出 4480 × 3760 高清 PNG');}else A.toast('PNG 导出失败，请试试 SVG',true);},'image/png');};img.onerror=()=>{URL.revokeObjectURL(url);button.disabled=false;A.toast('PNG 导出失败，请试试 SVG',true);};img.src=url;}
  function renderChat(){const v=state.video;$('chat-content').innerHTML=`<div id="chat-welcome" class="chat-welcome" ${state.messages.length?'hidden':''}><span class="ai-brand-icon">${A.icon('message-circle')}</span><h3>有疑问，就继续问。</h3><p>基于这段视频，和 AI 一起再想深一点。</p><div class="suggestions">${v.suggestions.map((q,i)=>`<button class="suggestion" data-suggestion="${i}">${q}${A.icon('arrow-up-right')}</button>`).join('')}</div></div><div class="chat-messages" id="chat-messages" aria-live="off"></div><form id="chat-form"><label class="chat-input-label" for="chat-input">问问视频里的内容</label><div class="chat-form"><textarea id="chat-input" rows="2" maxlength="1200" placeholder="比如：帮我梳理一下核心观点…" ${state.chatBusy?'disabled':''}></textarea><button class="button primary" id="chat-send" aria-label="发送问题" ${state.chatBusy?'disabled':''}>${A.icon('send')}</button></div><p class="chat-helper">Enter 发送 · Shift + Enter 换行 · 预设回答，仅演示视频相关问答</p></form>`;drawMessages();document.querySelectorAll('[data-suggestion]').forEach(b=>b.onclick=()=>sendQuestion(v.suggestions[Number(b.dataset.suggestion)]));$('chat-form').onsubmit=e=>{e.preventDefault();sendQuestion($('chat-input').value);};$('chat-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendQuestion($('chat-input').value);}};}
  function drawMessages(){const list=$('chat-messages');list.innerHTML=state.messages.map((m,i)=>`<div class="chat-row ${m.role}"><span class="avatar">${m.role==='user'?A.esc(A.getUser().email[0].toUpperCase()):A.icon('sparkles')}</span><div class="chat-bubble">${m.loading&&!m.content?'<span class="spinner"></span> 正在思考…':A.esc(m.content)}${m.error?`<div class="chat-retry">回答暂时中断<button type="button" data-retry-question="${i}">重新回答</button></div>`:''}</div></div>`).join('');list.querySelectorAll('[data-retry-question]').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.retryQuestion);const question=state.messages[index-1].content;state.messages.splice(index-1,2);state.scenario='normal';$('scenario').value='normal';sendQuestion(question);});list.scrollTop=list.scrollHeight;}
  function makeAnswer(question){
    if(state.video.platform==='YouTube')return /练习/.test(question)?'可以做一个 30 秒的无对白小故事：\n\n1. 设定角色想要得到的东西。\n2. 用一个动作表现阻碍。\n3. 在结尾呼应开头的道具。\n\n先画 6 格分镜，再检查：观众不看文字，能否看懂角色在做什么？\n\n这是根据示例故事分析给出的创作建议。':'这段短片的启发是：用动作、镜头和节奏讲清楚故事。\n\n开场建立环境与角色；中段通过冲突推动剧情；结尾用视觉呼应完成收束。你可以留意角色动作前后的停顿，以及画面反差如何形成情绪变化。\n\n以上为原型预设回答，不是实时模型分析。';
    if(/微调|区别/.test(question))return 'RAG 和微调解决的问题不同：\n\n• RAG 在回答时检索外部资料，适合知识更新频繁、需要引用来源的场景。\n• 微调通过训练调整模型行为，更常用于风格、格式或特定任务的稳定表现。\n\n视频在 00:00–03:24 介绍了模型知识的局限。对于企业文档问答，可以先从 RAG 验证需求，再判断是否需要训练。\n\n这是演示回答，区别说明是对视频主题的补充。';
    if(/新手|开始|步骤|怎么做|搭建/.test(question))return '可以从一个小知识库开始：\n\n1. 选 3–5 篇你熟悉的文档，清洗并按语义切分。\n2. 转换为向量，验证是否能找到与问题有关的片段。\n3. 将问题和检索片段交给模型，要求标明来源。\n4. 准备 10 个真实问题，检查回答是否有依据。\n\n对应视频 03:24 的知识库准备、08:15 的检索流程，以及 17:30 的效果评估。';
    if(/切分|向量|检索|重排/.test(question))return '视频把检索过程分成两个重点：\n\n先按语义切分文档，再把片段转换成向量；查询时检索相关片段，必要时结合关键词与重排序。\n\n切分需要尽量保留完整信息，不能只追求固定字数。检索到的内容质量会影响后续生成，因此先检查“有没有找对资料”，再调生成提示词。\n\n可以回顾 03:24 和 08:15 两个章节。';
    if(/那|它|为什么|进一步|具体|例子/.test(question)&&state.messages.length>2)return '接着刚才的话题，可以把它放进“员工查询请假制度”的例子：\n\n先检索最新版制度中的相关段落，再让模型结合员工问题作答，并展示来源。如果没有找到规定，就明确说明依据不足。\n\n这样做的重点是让答案来自资料，而不是让模型凭印象补全。视频 13:42 的上下文生成和 17:30 的评估都围绕这个目标展开。';
    if(/核心|总结|观点|重点/.test(question))return '视频的核心观点是：先检索可靠资料，再让大模型基于这些资料生成回答。\n\n完整流程可以记成：文档准备 → 向量与关键词检索 → 重排序 → 结合上下文生成 → 用真实问题评估。\n\n尤其要关注资料质量、来源引用，以及依据不足时明确说明。你可以从 08:15 的检索环节开始回顾。';
    return `这套原型使用预设回答，暂时不能真实分析“${question.slice(0,65)}”。\n\n本视频示例聚焦 RAG 的知识库准备、检索、生成与评估。你可以继续问“RAG 和微调有什么区别？”或“作为新手该从哪一步开始？”，体验相关的问答内容。`;
  }
  async function sendQuestion(raw){const question=raw.trim();if(!question||state.chatBusy)return;if(!A.getUser()){A.openAuth('login');return;}if(!state.ready)return;
    state.chatBusy=true;const run=++state.chatRun;state.messages.push({role:'user',content:question});const answer={role:'assistant',content:'',loading:true};state.messages.push(answer);$('chat-welcome').hidden=true;$('chat-input').value='';$('chat-input').disabled=true;$('chat-send').disabled=true;drawMessages();await wait(650);if(run!==state.chatRun)return;
    if(state.scenario==='chat-error'){answer.loading=false;answer.error=true;answer.content='AI 暂时没有响应，请重试。';state.chatBusy=false;drawMessages();$('chat-input').disabled=false;$('chat-send').disabled=false;return;}
    const text=makeAnswer(question);for(let i=0;i<text.length;i+=reduced?text.length:9){if(run!==state.chatRun)return;answer.content=text.slice(0,i+(reduced?text.length:9));drawMessages();await wait(reduced?0:22);}
    answer.loading=false;state.chatBusy=false;$('chat-input').disabled=false;$('chat-send').disabled=false;drawMessages();
  }
  $('download-button').onclick=async()=>{if(state.downloadBusy)return;state.downloadBusy=true;const run=++state.downloadRun;const button=$('download-button');button.disabled=true;const format=state.video.formats[Number(document.querySelector('input[name=format]:checked').value)];$('download-status').innerHTML='<span>正在准备 '+format.quality+' '+format.ext+'…</span><div class="progress-track"><div class="progress-fill" id="download-progress" style="width:0"></div></div>';
    document.querySelectorAll('input[name=format]').forEach(input=>input.disabled=true);for(let p=10;p<=100;p+=10){await wait(150);if(run!==state.downloadRun)return;if(state.scenario==='download-error'&&p===50)break;$('download-progress').style.width=p+'%';}
    if(run!==state.downloadRun)return;state.downloadBusy=false;button.disabled=false;document.querySelectorAll('input[name=format]').forEach(input=>input.disabled=false);
    if(state.scenario==='download-error'){$('download-status').innerHTML='<div class="inline-error">下载暂时中断，试试重新获取。<button class="text-button tiny" id="download-retry">重新下载</button></div>';$('download-retry').onclick=()=>{state.scenario='normal';$('scenario').value='normal';button.click();};return;}
    $('download-status').innerHTML=`<div class="inline-success">${A.icon('check-circle')} ${format.quality} ${format.ext} · 下载流程演示完成。<br>原型未下载真实视频，可在右侧实际导出字幕与导图。</div>`;A.toast('视频下载流程演示完成');
  };
  $('scenario-toggle').onclick=()=>{const panel=$('scenario-panel');panel.hidden=!panel.hidden;$('scenario-toggle').setAttribute('aria-expanded',!panel.hidden);};
  $('apply-scenario').onclick=()=>{state.scenario=$('scenario').value;parse(state.url);};
  document.addEventListener('saveany:parse',e=>parse(e.detail));
  document.addEventListener('saveany:user-change',()=>{
    syncQuota();if(!state.parsed)return;
    if(!A.getUser()){state.run++;state.chatRun++;state.generating=false;state.ready=false;state.chatBusy=false;state.messages=[];resetPanels();renderGate();}
    else if(!state.ready&&!state.generating){if(state.scenario==='quota'){const u=A.getUser();A.save(`saveany.quota.${u.email}`,{date:new Date().toLocaleDateString('sv-SE'),used:3});}renderGate();if(A.remaining()>0)startSummary();}
  });
  const params=new URLSearchParams(location.search);state.scenario=params.get('scene')||'normal';if(![...$('scenario').options].some(o=>o.value===state.scenario))state.scenario='normal';$('scenario').value=state.scenario;
  const candidate=params.get('url')||A.examples.bilibili;const checked=A.validateUrl(candidate);parse(checked.error?A.examples.bilibili:checked.url,false);
})();

</script>

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # 非 root 进程使用可写临时目录。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 后端重建后重新解析 Compose DNS，避免沿用旧容器 IP。
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # SSE 及时送达；下载响应不写入 Nginx 临时文件。
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 每个私人功能入口直接返回自己的页面信息，不把首页信息用于订单和历史。
        location ~ ^/(workbench|queue|billing)/?$ {
            add_header X-Robots-Tag "noindex, follow" always;
            try_files /_pages/$1.html =404;
        }

        location ~ ^/history(?:/(?:summary|download)/[^/]+)?/?$ {
            add_header X-Robots-Tag "noindex, follow" always;
            try_files /_pages/history.html =404;
        }

        location /_pages/ { internal; }
        location = /guide {
            absolute_redirect off;
            return 301 /guide/;
        }
        location = /guide/ { try_files /guide/index.html =404; }
        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header X-Robots-Tag "noindex, follow" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

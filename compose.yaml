services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 只在运行时加载；.dockerignore 阻止真实配置进入构建上下文。
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /app/backend/data/app.db
      DOWNLOAD_DIR: /app/backend/downloads
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      FRONTEND_URL: http://127.0.0.1:8080
    volumes:
      - database:/app/backend/data
      - downloads:/app/backend/downloads
    expose:
      - "8000"
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

# 普通 down 保留数据；这些卷与 PowerShell 模式的本机文件相互独立。
volumes:
  database:
  downloads:
